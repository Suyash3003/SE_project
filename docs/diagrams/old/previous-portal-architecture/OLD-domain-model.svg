<path d="M772 249 H828" class="line" marker-end="url(#end)"/><text x="800" y="238" text-anchor="middle" class="note">1 : N</text>
<path d="M918 292 V328 H682 V358" class="line" marker-end="url(#end)"/><text x="802" y="320" class="note">1 : N</text>
<path d="M772 401 H828" class="line" marker-end="url(#end)"/><text x="800" y="390" text-anchor="middle" class="note">transfer records</text>
