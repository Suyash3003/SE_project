<text x="88" y="578" class="head">SALES SIGNALS</text>
<rect x="210" y="626" width="180" height="100" rx="10" fill="#fff" stroke="#f472b6"/><text x="230" y="656" class="head">SalesHistory</text><text x="230" y="680" class="body">SKU • region • date</text><text x="230" y="702" class="body">quantity • revenue</text>
<rect x="565" y="546" width="470" height="236" rx="16" fill="#f5f3ff" stroke="#c4b5fd" class="group"/>
<text x="589" y="578" class="head">IDENTITY &amp; ACCESS</text>
<rect x="710" y="626" width="180" height="100" rx="10" fill="#fff" stroke="#a78bfa"/><text x="730" y="656" class="head">User</text><text x="730" y="680" class="body">email / phone</text><text x="730" y="702" class="body">role • status • dealer_id</text>
<rect x="1066" y="546" width="470" height="236" rx="16" fill="#f1f5f9" stroke="#94a3b8" class="group"/>
<text x="1090" y="578" class="head">LOGICAL REFERENCE LINKS</text>
<text x="1094" y="626" class="body">• Shade.product_id → Product.id</text>
<text x="1094" y="654" class="body">• SKU.shade_id → Shade.id</text>
<text x="1094" y="682" class="body">• InventoryLevel.warehouse_id / sku_id</text>
<text x="1094" y="710" class="body">• DealerOrder.dealer_id / sku_id</text>
<text x="1094" y="738" class="body">• SalesHistory.sku_id / region_id</text>
<path d="M300 493 V626" class="line" marker-end="url(#end)"/><text x="313" y="560" class="note">SKU history</text>
<path d="M300 444 V512 H682 V626" class="line" marker-end="url(#end)"/><text x="480" y="502" class="note">account</text>
<path d="M682 493 V626" class="line" marker-end="url(#end)"/>
<path d="M918 493 V526 H1301 V626" class="line" marker-end="url(#end)"/><text x="1084" y="516" class="note">dealer / request association</text>
<rect x="64" y="824" width="1472" height="112" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="88" y="858" class="head">Persistence note</text>
<text x="88" y="888" class="body">These are logical domain references implemented as document fields. The current SQLite adapter stores JSON payloads in a shared documents table;</text>
<text x="88" y="912" class="body">the diagram does not imply relational foreign-key constraints or database-enforced joins.</text>
<text x="64" y="974" class="note">Source: backend/app/models/* and backend/app/database.py • Logical relationships are inferred from id fields and service queries.</text>
</svg>