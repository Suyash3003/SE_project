<rect x="592" y="206" width="180" height="86" rx="10" fill="#fff" stroke="#4ade80"/><text x="612" y="234" class="head">Region</text><text x="612" y="258" class="body">name • states</text>
<rect x="828" y="206" width="180" height="86" rx="10" fill="#fff" stroke="#4ade80"/><text x="848" y="234" class="head">Warehouse</text><text x="848" y="258" class="body">region • city • geo</text><text x="848" y="278" class="body">capacity</text>
