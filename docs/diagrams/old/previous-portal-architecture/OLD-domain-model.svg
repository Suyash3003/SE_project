<rect x="1211" y="358" width="180" height="86" rx="10" fill="#fff" stroke="#fb923c"/><text x="1231" y="386" class="head">CustomerOrderRequest</text><text x="1231" y="410" class="body">customer • shade • dealer</text><text x="1231" y="430" class="body">status • quantity</text>
