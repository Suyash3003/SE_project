<rect x="328" y="206" width="180" height="86" rx="10" fill="#fff" stroke="#60a5fa"/><text x="348" y="234" class="head">Shade</text><text x="348" y="258" class="body">shade code • HEX/RGB</text><text x="348" y="278" class="body">family • trending</text>
