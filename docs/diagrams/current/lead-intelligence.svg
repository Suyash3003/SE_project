<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1800 1240" role="img" aria-labelledby="ti de"><title id="ti">Modern Colours — Lead Intelligence — Weighted Prioritization Workflow</title><desc id="de">Structured lead and prospect presentation through normalized fit, engagement, intent and recency factors into a transparent weighted score for follow-up prioritization.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs><rect width="1800" height="1240" fill="#fff"/><text x="55" y="34" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" fill="#555">MODERN COLOURS / SOFTWARE ENGINEERING DESIGN</text><text x="1745" y="34" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" fill="#555">THREE-MODULE FRONTEND SYSTEM</text><path d="M55 55H1745" stroke="#111" stroke-width="1.7"/><text x="55" y="110" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="31" font-weight="700" fill="#111">Lead Intelligence — Weighted Prioritization Workflow</text><text x="55" y="146" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="400" fill="#555" font-style="italic">Structured lead and prospect presentation through normalized fit, engagement, intent and recency factors into a transparent weighted score for follow-up prioritization.</text><rect x="55" y="185" width="1690" height="980" rx="6" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 6"/><text x="900" y="176" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="#111">LEAD / PROSPECT INTELLIGENCE BOUNDARY</text><path d="M900 285 L900 335" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><path d="M900 435 L310 535" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><path d="M900 435 L900 535" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><path d="M900 435 L1490 535" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><path d="M310 675 L370 775" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><path d="M900 675 L900 805" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><path d="M1490 675 L1430 775" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><path d="M640 865 L710 865" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="615.5" y="839" width="119" height="18" fill="#fff"/><text x="675" y="853" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">normalized inputs</text><path d="M1090 865 L1160 865" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="1086.5" y="839" width="77" height="18" fill="#fff"/><text x="1125" y="853" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">score 0–100</text><path d="M900 940 L900 1030" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="650" y="205" width="500" height="80" fill="#fff" stroke="#111" stroke-width="2"/><line x1="650" y1="238" x2="1150" y2="238" stroke="#111"/><text x="900" y="229" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">START / OPEN /lead-module</text><text x="900" y="222" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;entry event&gt;&gt;</text><text x="900" y="275" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">lead_system/</text><rect x="650" y="335" width="500" height="100" fill="#fff" stroke="#111" stroke-width="2"/><line x1="650" y1="368" x2="1150" y2="368" stroke="#111"/><text x="900" y="359" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">C1  LOAD STRUCTURED LEAD INFORMATION</text><text x="900" y="352" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;process&gt;&gt;</text><text x="900" y="405" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">lead records • prospect context • opportunity views</text><rect x="70" y="535" width="480" height="140" fill="#fff" stroke="#111" stroke-width="2"/><line x1="70" y1="568" x2="550" y2="568" stroke="#111"/><text x="310" y="559" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">C2  LEAD MANAGEMENT</text><text x="310" y="552" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;process&gt;&gt;</text><text x="310" y="605" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">structured lead information</text><text x="310" y="625" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">lead overview / activity context</text><rect x="660" y="535" width="480" height="140" fill="#fff" stroke="#111" stroke-width="2"/><line x1="660" y1="568" x2="1140" y2="568" stroke="#111"/><text x="900" y="559" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">C3  PROSPECT TRACKING</text><text x="900" y="552" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;process&gt;&gt;</text><text x="900" y="605" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">prospective customer context</text><text x="900" y="625" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">engagement / recency signals</text><rect x="1250" y="535" width="480" height="140" fill="#fff" stroke="#111" stroke-width="2"/><line x1="1250" y1="568" x2="1730" y2="568" stroke="#111"/><text x="1490" y="559" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">C4  OPPORTUNITY VIEW</text><text x="1490" y="552" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;process&gt;&gt;</text><text x="1490" y="605" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">business-development status</text><text x="1490" y="625" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">follow-up / opportunity visibility</text><rect x="100" y="775" width="540" height="185" fill="#fff" stroke="#111" stroke-width="2"/><line x1="100" y1="808" x2="640" y2="808" stroke="#111"/><text x="370" y="799" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">C5  INPUT NORMALIZATION</text><text x="370" y="792" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;analytical preparation&gt;&gt;</text><text x="370" y="845" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">F = prospect fit against target profile</text><text x="370" y="865" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">E = engagement with business / sales team</text><text x="370" y="885" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">I = intent / opportunity strength</text><text x="370" y="905" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">R = recency of meaningful interaction</text><ellipse cx="900" cy="872.5" rx="190" ry="67.5" fill="#fff" stroke="#111" stroke-width="2"/><text x="900" y="822" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;weighted model&gt;&gt;</text><text x="900" y="865.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="700" fill="#111">LEAD SCORE</text><text x="900" y="890.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">0.35F + 0.30E + 0.25I + 0.10R</text><rect x="1160" y="775" width="540" height="185" fill="#fff" stroke="#111" stroke-width="2"/><line x1="1160" y1="808" x2="1700" y2="808" stroke="#111"/><text x="1430" y="799" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">C6  FOLLOW-UP PRIORITIZATION</text><text x="1430" y="792" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;decision support&gt;&gt;</text><text x="1430" y="845" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">factors normalized to 0–100</text><text x="1430" y="865" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">transparent weighted score</text><text x="1430" y="885" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">sort / review lead priority</text><text x="1430" y="905" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">not a guaranteed conversion probability</text><rect x="650" y="1030" width="500" height="100" fill="#fff" stroke="#111" stroke-width="2"/><line x1="650" y1="1063" x2="1150" y2="1063" stroke="#111"/><text x="900" y="1054" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">PRESENT LEAD / OPPORTUNITY CONTEXT</text><text x="900" y="1047" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;output&gt;&gt;</text><text x="900" y="1100" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">structured business-development view</text><path d="M55 1175H1745" stroke="#111" stroke-width="1.3"/><text x="55" y="1208" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="700" fill="#555">FIGURE 5 / LEAD INTELLIGENCE — WEIGHTED PRIORITIZATION WORKFLOW</text><text x="1745" y="1208" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="400" fill="#555">CONCEPTUAL MODEL • README-SPECIFIED SCOPE</text></svg>