<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1800 1240" role="img" aria-labelledby="ti de"><title id="ti">Modern Colours — Mathematical Foundations — Operational / Commercial Models</title><desc id="de">Model sheet containing the mathematical measures documented for production, sales, lead prioritization and deterministic scripted scenario progression.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs><rect width="1800" height="1240" fill="#fff"/><text x="55" y="34" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" fill="#555">MODERN COLOURS / SOFTWARE ENGINEERING DESIGN</text><text x="1745" y="34" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" fill="#555">THREE-MODULE FRONTEND SYSTEM</text><path d="M55 55H1745" stroke="#111" stroke-width="1.7"/><text x="55" y="110" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="31" font-weight="700" fill="#111">Mathematical Foundations — Operational / Commercial Models</text><text x="55" y="146" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="400" fill="#555" font-style="italic">Model sheet containing the mathematical measures documented for production, sales, lead prioritization and deterministic scripted scenario progression.</text><rect x="35" y="165" width="550" height="930" rx="6" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 6"/><text x="310" y="156" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="#111">PRODUCTION EQUATIONS</text><rect x="610" y="165" width="550" height="930" rx="6" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 6"/><text x="885" y="156" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="#111">COMMERCIAL EQUATIONS</text><rect x="1185" y="165" width="550" height="930" rx="6" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 6"/><text x="1460" y="156" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="#111">PRIORITIZATION / STATE EQUATIONS</text><path d="M325 645 L325 690" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="286.5" y="641.5" width="77" height="18" fill="#fff"/><text x="325" y="655.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">derive KPIs</text><path d="M900 655 L900 700" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="840.5" y="651.5" width="119" height="18" fill="#fff"/><text x="900" y="665.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">derive order KPIs</text><path d="M1475 700 L1475 750" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="1408.5" y="699" width="133" height="18" fill="#fff"/><text x="1475" y="713" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">apply score / state</text><rect x="55" y="205" width="540" height="850" fill="#fff" stroke="#111" stroke-width="2"/><line x1="55" y1="238" x2="595" y2="238" stroke="#111"/><text x="325" y="229" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">A. PRODUCTION / MACHINE</text><text x="325" y="222" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;deterministic KPI family&gt;&gt;</text><rect x="630" y="205" width="540" height="850" fill="#fff" stroke="#111" stroke-width="2"/><line x1="630" y1="238" x2="1170" y2="238" stroke="#111"/><text x="900" y="229" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">B. SALES / ORDER MANAGEMENT</text><text x="900" y="222" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;commercial analytics family&gt;&gt;</text><rect x="1205" y="205" width="540" height="850" fill="#fff" stroke="#111" stroke-width="2"/><line x1="1205" y1="238" x2="1745" y2="238" stroke="#111"/><text x="1475" y="229" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">C. LEAD / SCENARIO MODELS</text><text x="1475" y="222" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;rule-based / scripted family&gt;&gt;</text><rect x="85" y="290" width="480" height="135" fill="#fff" stroke="#111" stroke-width="2"/><line x1="85" y1="323" x2="565" y2="323" stroke="#111"/><text x="325" y="314" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">OVERALL EQUIPMENT EFFECTIVENESS</text><text x="325" y="307" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;composite KPI&gt;&gt;</text><text x="325" y="360" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">OEE = A × P × Q</text><rect x="85" y="465" width="480" height="180" fill="#fff" stroke="#111" stroke-width="2"/><line x1="85" y1="498" x2="565" y2="498" stroke="#111"/><text x="325" y="489" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">AVAILABILITY / PERFORMANCE / QUALITY</text><text x="325" y="482" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;ratio definitions&gt;&gt;</text><text x="325" y="535" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">A = Operating Time / Planned Time</text><text x="325" y="555" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">P = Ideal Cycle × Total Units / Operating Time</text><text x="325" y="575" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Q = Good Units / Total Units</text><rect x="85" y="690" width="480" height="310" fill="#fff" stroke="#111" stroke-width="2"/><line x1="85" y1="723" x2="565" y2="723" stroke="#111"/><text x="325" y="714" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">PRODUCTION DERIVED MEASURES</text><text x="325" y="707" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;derived metrics&gt;&gt;</text><text x="325" y="760" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Utilization = Operating / Scheduled Time × 100</text><text x="325" y="780" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Throughput = Good Units / Elapsed Time</text><text x="325" y="800" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Batch completion = Completed / Planned × 100</text><text x="325" y="820" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Cycle variance = (Actual − Ideal) / Ideal × 100</text><rect x="660" y="290" width="480" height="150" fill="#fff" stroke="#111" stroke-width="2"/><line x1="660" y1="323" x2="1140" y2="323" stroke="#111"/><text x="900" y="314" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">FUNNEL CONVERSION</text><text x="900" y="307" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;stage metric&gt;&gt;</text><text x="900" y="360" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Next-stage opportunities / current-stage opportunities</text><text x="900" y="380" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">× 100</text><rect x="660" y="485" width="480" height="170" fill="#fff" stroke="#111" stroke-width="2"/><line x1="660" y1="518" x2="1140" y2="518" stroke="#111"/><text x="900" y="509" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">WEIGHTED PIPELINE VALUE</text><text x="900" y="502" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;weighted aggregation&gt;&gt;</text><text x="900" y="555" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Σ (Vⱼ × pⱼ)</text><text x="900" y="575" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">V = opportunity value</text><text x="900" y="595" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">p = configured stage probability</text><rect x="660" y="700" width="480" height="300" fill="#fff" stroke="#111" stroke-width="2"/><line x1="660" y1="733" x2="1140" y2="733" stroke="#111"/><text x="900" y="724" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">ORDER PERFORMANCE</text><text x="900" y="717" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;derived metrics&gt;&gt;</text><text x="900" y="770" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">AOV = Total Order Value / Number of Orders</text><text x="900" y="790" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Fulfilment = Fulfilled / Due × 100</text><text x="900" y="810" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Measures are computed from prepared commercial records</text><rect x="1235" y="290" width="480" height="180" fill="#fff" stroke="#111" stroke-width="2"/><line x1="1235" y1="323" x2="1715" y2="323" stroke="#111"/><text x="1475" y="314" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">WEIGHTED LEAD SCORE</text><text x="1475" y="307" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;multi-criteria score&gt;&gt;</text><text x="1475" y="360" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">L = 0.35F + 0.30E + 0.25I + 0.10R</text><text x="1475" y="380" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">F fit • E engagement • I intent • R recency</text><rect x="1235" y="520" width="480" height="180" fill="#fff" stroke="#111" stroke-width="2"/><line x1="1235" y1="553" x2="1715" y2="553" stroke="#111"/><text x="1475" y="544" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">NORMALIZATION / INTERPRETATION</text><text x="1475" y="537" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;input model&gt;&gt;</text><text x="1475" y="590" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Each factor normalized to 0–100</text><text x="1475" y="610" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">Explicit business-rule weights</text><text x="1475" y="630" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">No trained conversion estimator implied</text><rect x="1235" y="750" width="480" height="250" fill="#fff" stroke="#111" stroke-width="2"/><line x1="1235" y1="783" x2="1715" y2="783" stroke="#111"/><text x="1475" y="774" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">SCRIPTED STATE TRANSITION</text><text x="1475" y="767" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#555" font-style="italic">&lt;&lt;time-dependent deterministic model&gt;&gt;</text><text x="1475" y="820" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">S(t + Δt) = T(S(t), Δt, C)</text><text x="1475" y="840" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">S = displayed state • Δt = simulated time</text><text x="1475" y="860" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#111">C = prepared scenario configuration</text><path d="M55 1175H1745" stroke="#111" stroke-width="1.3"/><text x="55" y="1208" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="700" fill="#555">FIGURE 17 / MATHEMATICAL FOUNDATIONS — OPERATIONAL / COMMERCIAL MODELS</text><text x="1745" y="1208" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="400" fill="#555">CONCEPTUAL MODEL • README-SPECIFIED SCOPE</text></svg>