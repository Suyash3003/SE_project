 width="180" height="65" fill="#fff" stroke="#111" stroke-width="2"/><line x1="1080" y1="243" x2="1260" y2="243" stroke="#111"/><text x="1170" y="234" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">SELECTED VITE APP</text><rect x="1330" y="210" width="180" height="65" fill="#fff" stroke="#111" stroke-width="2"/><line x1="1330" y1="243" x2="1510" y2="243" stroke="#111"/><text x="1420" y="234" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">DESIGN KIT</text><rect x="1580" y="210" width="180" height="65" fill="#fff" stroke="#111" stroke-width="2"/><line x1="1580" y1="243" x2="1760" y2="243" stroke="#111"/><text x="1670" y="234" text-anchor="middle" font-family="Georgia" font-size="17" font-weight="700">SCENARIO CLOCK</text><path d="M55 1175H1745" stroke="#111" stroke-width="1.3"/><text x="55" y="1208" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="700" fill="#555">FIGURE 14 / SEQUENCE DIAGRAM — LANDING TO MODULE RUNTIME</text><text x="1745" y="1208" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="400" fill="#555">CONCEPTUAL MODEL • README-SPECIFIED SCOPE</text><path d="M170 275V1100" stroke="#555" stroke-width="1.5" stroke-dasharray="7 7"/><path d="M420 275V1100" stroke="#555" stroke-width="1.5" stroke-dasharray="7 7"/><path d="M670 275V1100" stroke="#555" stroke-width="1.5" stroke-dasharray="7 7"/><path d="M920 275V1100" stroke="#555" stroke-width="1.5" stroke-dasharray="7 7"/><path d="M1170 275V1100" stroke="#555" stroke-width="1.5" stroke-dasharray="7 7"/><path d="M1420 275V1100" stroke="#555" stroke-width="1.5" stroke-dasharray="7 7"/><path d="M1670 275V1100" stroke="#555" stroke-width="1.5" stroke-dasharray="7 7"/></svg>