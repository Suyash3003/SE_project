<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1800 1240" role="img" aria-labelledby="ti de"><title id="ti">Modern Colours — Sequence Diagram — Landing to Module Runtime</title><desc id="de">Numbered interactions across user, browser, landing page, route dispatcher, selected Vite application, shared design resources and simulated scenario controller.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs><rect width="1800" height="1240" fill="#fff"/><text x="55" y="34" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" fill="#555">MODERN COLOURS / SOFTWARE ENGINEERING DESIGN</text><text x="1745" y="34" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" fill="#555">THREE-MODULE FRONTEND SYSTEM</text><path d="M55 55H1745" stroke="#111" stroke-width="1.7"/><text x="55" y="110" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="31" font-weight="700" fill="#111">Sequence Diagram — Landing to Module Runtime</text><text x="55" y="146" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="400" fill="#555" font-style="italic">Numbered interactions across user, browser, landing page, route dispatcher, selected Vite application, shared design resources and simulated scenario controller.</text><path d="M260 320 L330 320" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="256.5" y="294" width="77" height="18" fill="#fff"/><text x="295" y="308" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">1. open URL</text><path d="M510 390 L580 390" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="482" y="364" width="126" height="18" fill="#fff"/><text x="545" y="378" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">2. request landing</text><path d="M760 460 L830 460" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="753" y="434" width="84" height="18" fill="#fff"/><text x="795" y="448" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">3. route map</text><path d="M830 530 L1080 530" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="864" y="504" width="182" height="18" fill="#fff"/><text x="955" y="518" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">4. select module base path</text><path d="M1080 600 L1330 600" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="1128" y="574" width="154" height="18" fill="#fff"/><text x="1205" y="588" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">5. apply shared tokens</text><path d="M1080 670 L1580 670" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="1228.5" y="644" width="203" height="18" fill="#fff"/><text x="1330" y="658" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">6. initialize simulated clock</text><path d="M1580 740 L1080 740" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x="1246" y="746" width="168" height="18" fill="#fff"/><text x="1330" y="760" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" font-weight="400" fill="#444" font-style="italic">7. return prepared state</text><path d="M1080 810 L330 810" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><rect x