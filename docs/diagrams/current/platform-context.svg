<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1560 960" role="img" aria-labelledby="title desc">
<title id="title">Modern Colours — Platform Context — Three Applications, One Suite</title>
<desc id="desc">One landing page routes users into three independent operational frontends. Shared conventions unify the experience; the current demo does not imply a live shared backend.</desc>
<defs>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263657" flood-opacity=".09"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#9AA7BD"/></marker>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#E5EAF3"/></pattern>
</defs>
<rect width="1560" height="960" fill="#F5F7FC"/>
<rect width="1560" height="960" fill="url(#grid)" opacity=".8"/>
<rect x="0" y="0" width="1560" height="14" fill="#7157E8"/>
<text x="70" y="78" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="800" fill="#17213D">Platform Context — Three Applications, One Suite</text>
<text x="70" y="119" font-family="Inter,Arial,sans-serif" font-size="19" fill="#66728A">One landing page routes users into three independent operational frontends. Shared conventions unify the experience; the current demo does not imply a live shared backend.</text>
