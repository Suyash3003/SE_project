<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1560 960" role="img" aria-labelledby="title desc">
<title id="title">Modern Colours — Scripted Scenario &amp; Presenter-Control Architecture</title>
<desc id="desc">A simulated clock drives prepared interface scenarios for repeatable demos, while the hidden presenter console exposes playback controls.</desc>
