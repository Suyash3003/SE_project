      <text x="599" y="245" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">SIMULATED CLOCK</text>
      <text x="601" y="304" font-family="Inter,Arial,sans-serif" font-size="19" fill="#25304A"><tspan x="601" dy="0">Advances scripted interface state</tspan><tspan x="601" dy="30">Automatic cycle approximately every 4 minutes</tspan><tspan x="601" dy="30">Consistent walkthrough timing</tspan></text>
    </g>
