      <text x="104" y="245" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">PREPARED SCENARIOS</text>
      <text x="106" y="304" font-family="Inter,Arial,sans-serif" font-size="19" fill="#25304A"><tspan x="106" dy="0">Seeded demonstration records</tspan><tspan x="106" dy="30">Predefined operational moments</tspan><tspan x="106" dy="30">No live ERP data feed</tspan></text>
    </g>
