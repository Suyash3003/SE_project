<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1800 1240" role="img" aria-labelledby="ti de"><title id="ti">Modern Colours — Scenario Runtime — Activity / Presenter State Model</title><desc id="de">Scripted scenario initialization, simulated time progression, presenter console shortcut, playback rates and jump/reset controls; not live telemetry.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs><rect width="1800" height="1240" fill="#fff"/><text x="55" y="34" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" fill="#555">MODERN COLOURS / SOFTWARE ENGINEERING DESIGN</text><text x="1745" y="34" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="14" font-weight="700" fill="#555">THREE-MODULE FRONTEND SYSTEM</text><path d="M55 55H1745" stroke="#111" stroke-width="1.7"/><text x="55" y="110" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="31" font-weight="700" fill="#111">Scenario Runtime — Activity / Presenter State Model</text><text x="55" y="146" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="400" fill="#555" font-style="italic">Scripted scenario initialization, simulated time progression, presenter console shortcut, playback rates and jump/reset controls; not live telemetry.</text><rect x="40" y="165" width="1720" height="1000" rx="6" fill="none" stroke="#111" stroke-width="1.8" stroke-dasharray="8 6"/><text x="900" y="156" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" font-weight="700" fill="#111">SCRIPTED SCENARIO SUBSYSTEM</text><path d="M900 280 L900 330" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><path d="M900 420 L900 480" fill="none" stroke="#111" stroke-width="1.8" marker-end="url(#a)"/><path d="M900 57