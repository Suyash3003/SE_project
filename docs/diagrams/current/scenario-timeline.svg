<text x="70" y="78" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="800" fill="#17213D">Scripted Scenario &amp; Presenter-Control Architecture</text>
<text x="70" y="119" font-family="Inter,Arial,sans-serif" font-size="19" fill="#66728A">A simulated clock drives prepared interface scenarios for repeatable demos, while the hidden presenter console exposes playback controls.</text>
