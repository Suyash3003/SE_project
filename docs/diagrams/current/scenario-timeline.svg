      <text x="1096" y="304" font-family="Inter,Arial,sans-serif" font-size="19" fill="#25304A"><tspan x="1096" dy="0">Production &amp; Machine</tspan><tspan x="1096" dy="30">Sales &amp; Order Management</tspan><tspan x="1096" dy="30">Lead Intelligence</tspan></text>
    </g>
<g filter="url(#shadow)">
      <rect x="180" y="545" width="565" height="245" rx="22" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="2"/>
      <path d="M 202 545 H 723 Q 745 545 745 567 V 607 H 180 V 567 Q 180 545 202 545" fill="#D98A28"/>
      <text x="204" y="585" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">PRESENTER CONSOLE</text>
      <text x="206" y="644" font-family="Inter,Arial,sans-serif" font-size="19" fill="#25304A"><tspan x="206" dy="0">Shortcut: Ctrl + Shift + D</tspan><tspan x="206" dy="30">Play / Pause  •  1× normal speed</tspan><tspan x="206" dy="30">5× accelerated  •  20× fast-forward</tspan><tspan x="206" dy="30">Jump to predefined moments  •  Reset</tspan></text>
