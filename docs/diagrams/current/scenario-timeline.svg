      <text x="839" y="585" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">CONTEXTUAL ENTRY</text>
      <text x="841" y="644" font-family="Inter,Arial,sans-serif" font-size="19" fill="#25304A"><tspan x="841" dy="0">Example: /machine-module/?as=U-106</tspan><tspan x="841" dy="30">Opens a predefined user context</tspan><tspan x="841" dy="30">Designed for guided demos and displays</tspan></text>
    </g>
