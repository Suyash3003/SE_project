      <text x="91" y="304" font-family="Inter,Arial,sans-serif" font-size="19" fill="#25304A"><tspan x="91" dy="0">Project: machine_prod_extended/</tspan><tspan x="91" dy="30">Route: /machine-module</tspan><tspan x="91" dy="30">Production monitoring and machine views</tspan><tspan x="91" dy="30">Operator-specific workspaces</tspan><tspan x="91" dy="30">Batch tracking and scripted scenarios</tspan></text>
    </g>
