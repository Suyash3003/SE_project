<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1560 960" role="img" aria-labelledby="title desc">
<title id="title">Modern Colours — Modular Application Architecture</title>
<desc id="desc">Each module owns its application structure, Vite configuration and dependencies while consuming shared design resources and consistent business vocabulary.</desc>
<defs>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263657" flood-opacity=".09"/></filter>
