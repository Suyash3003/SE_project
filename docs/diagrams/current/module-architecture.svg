<text x="70" y="78" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="800" fill="#17213D">Modular Application Architecture</text>
<text x="70" y="119" font-family="Inter,Arial,sans-serif" font-size="19" fill="#66728A">Each module owns its application structure, Vite configuration and dependencies while consuming shared design resources and consistent business vocabulary.</text>
