      <text x="846" y="769" font-family="Inter,Arial,sans-serif" font-size="19" fill="#25304A"><tspan x="846" dy="0">Prepared seed data  •  simulated clock  •  presenter controls</tspan><tspan x="846" dy="30">Common reference vocabulary; not a live ERP integration</tspan></text>
