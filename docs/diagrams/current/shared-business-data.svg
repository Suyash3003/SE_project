<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1560 960" role="img" aria-labelledby="title desc">
<title id="title">Modern Colours — Shared Business Reference Model</title>
<desc id="desc">A common vocabulary and prepared reference set keeps information recognizable across modules; this is a logical convention map, not a physical database schema.</desc>
